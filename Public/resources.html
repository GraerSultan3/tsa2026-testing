<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">

        <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="Imports/fontSizing.css"> 
        <link rel="stylesheet" href="Imports/footer.css"> <!-- Imports -->
        
        <link rel="stylesheet" href="resources.css">
    </head>
    <body>
        <nav>
            <h1 id="title">Resources</h1>
            <a class="redirect" href="index.html">Home</a>
            <a class="redirect" href="index.html">Developments</a>
            <a class="redirect" href="history.html">History</a>
        </nav>

        <input type="text" id="search" placeholder="Search">
        <form id="filters">
            <div class="filterContainer"><input type="checkbox" name="isReligious" class="filter">
            <label for="isReligious">Religious Program</label></div>

            <div class="filterContainer"><input type="checkbox" name="isDiscriminatory" class="filter">
            <label for="isReligious">Discrimination Program</label></div>

            <div class="filterContainer"><input type="checkbox" name="isOutdoor" class="filter">
            <label for="isOutdoor">Outdoor Activity</label></div>

            <div class="filterContainer"><input type="checkbox" name="isYouth" class="filter">
            <label for="isYouth">Youth Programs</label></div>

            <button id="applyButton">Apply</button>
            <button id="openClose">Close</button>
        </form>

        <div id="resources">
        </div>

        <form id="submission">
            <h2>Resource Submission Form</h2>
            <h4>Is there a community resource near and dear to your heart? Tell us all about it down below, so we can promote the best in our beautiful town!</h4>

            <input type="text" name="resourceName" placeholder="Resource Name">
            <label><input type="url" name="resourceLink">Link To Resource Website</label>
            
            <label id="checkboxContainer">
                <label>What type of resource is this?</label>

                <label for="isReligious">
                    <input type="checkbox" name="isReligious">
                    Religious Program
                </label>

                <label for="isReligious">
                    <input type="checkbox" name="isDiscriminatory">
                    Discrimination Program
                </label>

                <label for="isReligious">
                    <input type="checkbox" name="isOutdoor">
                    Outdoor Activity
                </label>

                <label for="isReligious">
                    <input type="checkbox" name="isYouth">
                    Youth Program
                </label>
            </label>

            <input type="submit" value="Submit For Consideration">

            <label id="confirmationMessage">Thank You!</label>
        </form>

        <footer>
            <address>3450 Campus Dr, Bryan, TX, 77802</address>
            <address>example@gmail.com</address>
            <address>(123) 456-7890</address>
            <p>08:30 - 16:05</p>
        </footer>

        <script src="resources.js"></script>
    </body>
</html>
